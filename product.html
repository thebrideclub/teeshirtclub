<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>produto | tee shirt club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="menu">
  <div class="logo-container">
    <img src="logo.png" alt="tee shirt club" class="logo" />
  </div>
  <nav class="nav-container">
    <ul class="menu-list">
      <li><a href="index.html">home</a></li>
      <li><a href="shop.html">shop</a></li>
      <li><a href="cart.html">carrinho</a></li>
    </ul>
  </nav>
</header>

<main class="product-container">

  <!-- CARROSSEL -->
  <div class="product-carousel">
    <div class="product-carousel-track" id="carousel-track">
      <img id="produto-imagem" />
    </div>
  </div>

  <!-- INFO -->
  <div class="product-info">
    <h1 id="produto-nome"></h1>
    <p class="product-price">r$ 199,00</p>

    <!-- tamanhos -->
    <div class="size-selector">
      <p>tamanho</p>
      <div class="size-options">
        <button data-size="p">p</button>
        <button data-size="m">m</button>
        <button data-size="g">g</button>
        <button data-size="gg">gg</button>
      </div>
    </div>

    <!-- ação -->
    <div class="product-actions">
      <button onclick="addToCart()">adicionar ao carrinho</button>
    </div>
  </div>

</main>

<footer class="rodape-site">
  <p>tee shirt club<br>feito com intenção</p>
</footer>

<script>
const produtos = {
  sardines01: {
    nome: 'camiseta sardines 01',
    preco: 199,
    imagem: './sardines_tshirt.png'
  },
  sardines02: {
    nome: 'camiseta sardines 02',
    preco: 199,
    imagem: './sardine2.png'
  },
  loved01: {
    nome: 'camiseta loved 01',
    preco: 199,
    imagem: './camiseta3/frente.jpg'
  },
  rio01: {
    nome: 'camiseta rio 01',
    preco: 199,
    imagem: './camiseta4/frente.jpg'
  }
};

const params = new URLSearchParams(window.location.search);
const key = params.get('produto');
const produto = produtos[key];

if (!produto) {
  alert('produto não encontrado');
}

document.getElementById('produto-nome').innerText = produto.nome;
document.getElementById('produto-imagem').src = produto.imagem;

// seleção de tamanho
let tamanhoSelecionado = null;
const botoesTamanho = document.querySelectorAll('.size-options button');

botoesTamanho.forEach(btn => {
  btn.onclick = () => {
    botoesTamanho.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tamanhoSelecionado = btn.dataset.size;
  };
});

function addToCart() {
  if (!tamanhoSelecionado) {
    alert('selecione um tamanho');
    return;
  }

  const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

  carrinho.push({
    nome: produto.nome,
    preco: produto.preco,
    quantidade: 1,
    tamanho: tamanhoSelecionado,
    imagem: produto.imagem
  });

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  window.location.href = 'cart.html';
}
</script>

</body>
</html>
