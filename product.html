<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>produto | tee shirt club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="menu">
  <div class="logo-container">
    <img src="logo.png" alt="tee shirt club" class="logo" />
  </div>
  <nav class="nav-container">
    <ul class="menu-list">
      <li><a href="index.html">home</a></li>
      <li><a href="shop.html">shop</a></li>
      <li><a href="cart.html">carrinho</a></li>
    </ul>
  </nav>
</header>

<main class="product-container">
  <img id="produto-imagem" class="produto-img" />
  <div class="produto-info">
    <h1 id="produto-nome"></h1>
    <p class="preco">r$ 199,00</p>

    <label>
      tamanho
      <select id="produto-tamanho">
        <option value="">selecione</option>
        <option value="p">p</option>
        <option value="m">m</option>
        <option value="g">g</option>
        <option value="gg">gg</option>
      </select>
    </label>

    <button onclick="addToCart()">adicionar ao carrinho</button>
  </div>
</main>

<script>
const produtos = {
  sardines01: {
    nome: 'camiseta sardines 01',
    preco: 199,
    imagem: './sardines_tshirt.png'
  },
  sardines02: {
    nome: 'camiseta sardines 02',
    preco: 199,
    imagem: './sardine2.png'
  },
  loved01: {
    nome: 'camiseta loved 01',
    preco: 199,
    imagem: './camiseta3/frente.jpg'
  },
  rio01: {
    nome: 'camiseta rio 01',
    preco: 199,
    imagem: './camiseta4/frente.jpg'
  }
};

const params = new URLSearchParams(window.location.search);
const key = params.get('produto');
const produto = produtos[key];

if (!produto) {
  alert('produto não encontrado');
}

document.getElementById('produto-nome').innerText = produto.nome;
document.getElementById('produto-imagem').src = produto.imagem;

function addToCart() {
  const tamanho = document.getElementById('produto-tamanho').value;

  if (!tamanho) {
    alert('selecione um tamanho');
    return;
  }

  const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

  carrinho.push({
    nome: produto.nome,
    preco: produto.preco,
    quantidade: 1,
    tamanho: tamanho,
    imagem: produto.imagem
  });

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  window.location.href = 'cart.html';
}
</script>

</body>
</html>
