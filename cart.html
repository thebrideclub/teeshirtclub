<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>carrinho | tee shirt club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HEADER -->
<header class="menu">
  <div class="logo-container">
    <img src="logo.png" alt="tee shirt club" class="logo" />
  </div>

  <nav class="nav-container">
    <ul class="menu-list">
      <li><a href="index.html">home</a></li>
      <li><a href="shop.html">shop</a></li>
      <li><a href="cart.html" class="ativo">carrinho</a></li>
    </ul>
  </nav>
</header>

<!-- CARRINHO -->
<main class="cart-container">

  <p id="status">carregando carrinho...</p>
  <div id="cart"></div>

  <!-- DADOS DO CLIENTE -->
  <div class="checkout-form">
    <label>
      nome
      <input type="text" id="cliente-nome" placeholder="seu nome completo" />
    </label>

    <label>
      telefone / whatsapp
      <input type="tel" id="cliente-telefone" placeholder="(11) 99999-9999" />
    </label>
  </div>

</main>

<!-- FOOTER -->
<footer class="cart-footer">
  <p id="total">total: r$ 0,00</p>
  <button id="btnCheckout" onclick="checkout()">finalizar compra</button>
</footer>

<script>
  const cartEl = document.getElementById('cart');
  const statusEl = document.getElementById('status');
  const totalEl = document.getElementById('total');
  const btnCheckout = document.getElementById('btnCheckout');

  let carrinho = [];

  try {
    carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
  } catch {
    carrinho = [];
  }

  if (carrinho.length === 0) {
    statusEl.innerText = 'seu carrinho está vazio.';
  } else {
    statusEl.remove();
  }

  let total = 0;

  carrinho.forEach((item, index) => {
    const subtotal = item.preco * item.quantidade;
    total += subtotal;

    const div = document.createElement('div');
    div.className = 'cart-item';

    div.innerHTML = `
      <img src="${item.imagem}" alt="${item.nome}">
      <div class="cart-info">
        <h3>${item.nome}</h3>
        ${item.tamanho ? `<p>tamanho: ${item.tamanho.toUpperCase()}</p>` : ''}
        <p>quantidade: ${item.quantidade}</p>
        <p>r$ ${subtotal.toFixed(2)}</p>
        <button onclick="removeItem(${index})">remover</button>
      </div>
    `;

    cartEl.appendChild(div);
  });

  totalEl.innerText = 'total: r$ ' + total.toFixed(2);

  function removeItem(index) {
    carrinho.splice(index, 1);
    localStorage.setItem('carrinho', JSON.stringify(carrinho));
    location.reload();
  }

  async function checkout() {
    const nome = document.getElementById('cliente-nome').value.trim();
    const telefone = document.getElementById('cliente-telefone').value.trim();

    if (!nome || !telefone) {
      alert('por favor, preencha nome e telefone 😊');
      return;
    }

    if (carrinho.length === 0) {
      alert('seu carrinho está vazio');
      return;
    }

    btnCheckout.disabled = true;
    btnCheckout.innerText = 'redirecionando...';

    try {
      const response = await fetch('/.netlify/functions/criar-pagamento', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cliente: { nome, telefone },
          carrinho: carrinho
        })
      });

      const data = await response.json();

      if (!data.link) {
        throw new Error('link não retornado');
      }

      window.location.href = data.link;

    } catch (err) {
      alert('erro ao iniciar pagamento. tente novamente.');
      btnCheckout.disabled = false;
      btnCheckout.innerText = 'finalizar compra';
    }
  }
</script>

</body>
</html>
