<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>carrinho | tee shirt club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HEADER -->
<header class="menu">
  <div class="logo-container">
    <img src="logo.png" alt="tee shirt club" class="logo" />
  </div>

  <nav class="nav-container">
    <ul class="menu-list">
      <li><a href="index.html">home</a></li>
      <li><a href="shop.html">shop</a></li>
      <li><a href="cart.html" class="ativo">carrinho</a></li>
    </ul>
  </nav>
</header>

<!-- CARRINHO -->
<main class="cart-container">

  <p id="status">carregando carrinho...</p>
  <div id="cart"></div>

  <!-- DADOS DO CLIENTE -->
  <div class="checkout-form">
    <label>
      nome
      <input type="text" id="cliente-nome" placeholder="seu nome completo" />
    </label>

    <label>
      telefone / whatsapp
      <input type="tel" id="cliente-telefone" placeholder="(11) 99999-9999" />
    </label>
  </div>

</main>

<!-- FOOTER DO CARRINHO -->
<footer class="cart-footer">
  <p id="total">total: r$ 0,00</p>
  <button onclick="checkout()">finalizar compra</button>
</footer>

<!-- SCRIPT -->
<script>
  const cartEl = document.getElementById('cart');
  const statusEl = document.getElementById('status');
  const totalEl = document.getElementById('total');

  let carrinho = [];

  try {
    carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
  } catch (e) {
    carrinho = [];
  }

  if (carrinho.length === 0) {
    statusEl.innerText = 'seu carrinho está vazio.';
  } else {
    statusEl.remove();
  }

  let total = 0;

  carrinho.forEach((item, index) => {
    total += item.preco * item.quantidade;

    const div = document.createElement('div');
    div.className = 'cart-item';

    div.innerHTML = `
      <img src="${item.imagem}" alt="${item.nome}">
      <div>
        <h3>${item.nome}</h3>
        <p>quantidade: ${item.quantidade}</p>
        <p>r$ ${(item.preco * item.quantidade).toFixed(2)}</p>
        <button onclick="removeItem(${index})">remover</button>
      </div>
    `;

    cartEl.appendChild(div);
  });

  totalEl.innerText = 'total: r$ ' + total.toFixed(2);

  function removeItem(index) {
    carrinho.splice(index, 1);
    localStorage.setItem('carrinho', JSON.stringify(carrinho));
    location.reload();
  }

  function checkout() {
    const nome = document.getElementById('cliente-nome').value.trim();
    const telefone = document.getElementById('cliente-telefone').value.trim();

    if (!nome || !telefone) {
      alert('por favor, preencha nome e telefone 😊');
      return;
    }

    if (carrinho.length === 0) {
      alert('seu carrinho está vazio');
      return;
    }

    let mensagem = `🛒 *nova compra - tee shirt club*\n\n`;
    mensagem += `👤 nome: ${nome}\n`;
    mensagem += `📱 telefone: ${telefone}\n\n`;
    mensagem += `📦 *itens do pedido:*\n\n`;

    let totalPedido = 0;

    carrinho.forEach(item => {
      const subtotal = item.preco * item.quantidade;
      totalPedido += subtotal;

      mensagem += `• ${item.nome}\n`;
      mensagem += `  quantidade: ${item.quantidade}\n`;
      mensagem += `  valor: r$ ${subtotal.toFixed(2)}\n\n`;
    });

    mensagem += `💰 *total: r$ ${totalPedido.toFixed(2)}*`;

    const numeroLoja = '5511945163111';
    const url = `https://wa.me/${numeroLoja}?text=${encodeURIComponent(mensagem)}`;

    window.open(url, '_blank');
  }
</script>

</body>
</html>
