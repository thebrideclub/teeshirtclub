<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>carrinho | tee shirt club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="menu">
  <div class="logo-container">
    <img src="logo.png" alt="tee shirt club" class="logo" />
  </div>
  <nav class="nav-container">
    <ul class="menu-list">
      <li><a href="index.html">home</a></li>
      <li><a href="shop.html">shop</a></li>
      <li><a href="cart.html" class="ativo">carrinho</a></li>
    </ul>
  </nav>
</header>

<main class="cart-container">

  <p id="status">carregando carrinho...</p>
  <div id="cart"></div>

  <div class="checkout-form">
    <label>
      nome
      <input type="text" id="cliente-nome" placeholder="seu nome completo" />
    </label>

    <label>
      telefone / whatsapp
      <input type="tel" id="cliente-telefone" placeholder="(11) 99999-9999" />
    </label>
  </div>

</main>

<footer class="cart-footer">
  <p id="total">total: r$ 0,00</p>
  <button onclick="checkout()">finalizar compra</button>
</footer>

<script>
const cartEl = document.getElementById('cart');
const statusEl = document.getElementById('status');
const totalEl = document.getElementById('total');

const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

if (carrinho.length === 0) {
  statusEl.innerText = 'seu carrinho está vazio.';
}

let total = 0;

carrinho.forEach((item, index) => {
  const subtotal = item.preco * item.quantidade;
  total += subtotal;

  const div = document.createElement('div');
  div.className = 'cart-item';

  div.innerHTML = `
    <img src="${item.imagem}" alt="${item.nome}">
    <div class="cart-info">
      <h3>${item.nome}</h3>
      <p>tamanho: ${item.tamanho.toUpperCase()}</p>
      <p>quantidade: ${item.quantidade}</p>
      <p>r$ ${subtotal.toFixed(2)}</p>
      <button onclick="removeItem(${index})">remover</button>
    </div>
  `;

  cartEl.appendChild(div);
});

totalEl.innerText = 'total: r$ ' + total.toFixed(2);

function removeItem(index) {
  carrinho.splice(index, 1);
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  location.reload();
}

function checkout() {
  const nome = document.getElementById('cliente-nome').value.trim();
  const telefone = document.getElementById('cliente-telefone').value.trim();

  if (!nome || !telefone) {
    alert('preencha nome e telefone 😊');
    return;
  }

  let mensagem = `🛒 *nova compra - tee shirt club*\n\n`;
  mensagem += `👤 nome: ${nome}\n`;
  mensagem += `📱 telefone: ${telefone}\n\n`;
  mensagem += `📦 *itens do pedido:*\n\n`;

  carrinho.forEach(item => {
    mensagem += `• ${item.nome}\n`;
    mensagem += `  tamanho: ${item.tamanho.toUpperCase()}\n`;
    mensagem += `  quantidade: ${item.quantidade}\n`;
    mensagem += `  valor: r$ ${(item.preco * item.quantidade).toFixed(2)}\n\n`;
  });

  mensagem += `💰 *total: r$ ${total.toFixed(2)}*`;

  const telefoneLoja = '5511945163111';
  const url = `https://wa.me/${telefoneLoja}?text=${encodeURIComponent(mensagem)}`;

  window.open(url, '_blank');
}
</script>

</body>
</html>
