<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shop | tee shirt club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="menu">
  <div class="logo-container">
    <img src="logo.png" alt="tee shirt club" class="logo" />
  </div>
  <nav class="nav-container">
    <ul class="menu-list">
      <li><a href="index.html">home</a></li>
      <li><a href="shop.html" class="ativo">shop</a></li>
      <li><a href="index.html#sobre">sobre</a></li>
      <li><a href="index.html#contato">contato</a></li>
    </ul>
  </nav>
</header>

<main class="shop-container">
  <h1 class="shop-titulo">coleção oversized</h1>

  <section class="produtos-grid">

    <!-- PRODUTO 01 -->
    <article class="produto-card">
      <div class="carrossel" data-carrossel>
        <div class="carrossel-track">
          <img src="sardines_tshirt.png" />
          <img src="sardines_tshirt.png" />
          <img src="sardines_tshirt.png" />
          <img src="sardines_tshirt.png" />
        </div>
        <button class="prev">‹</button>
        <button class="next">›</button>
      </div>

      <h2>camiseta oversized 01</h2>
      <p class="preco">r$ 199,00</p>
      <p class="descricao">malha premium • modelagem ampla • unissex</p>
      <a href="produto1.html" class="botao-ver">ver produto</a>
    </article>

    <!-- PRODUTO 02 -->
    <article class="produto-card">
      <div class="carrossel" data-carrossel>
        <div class="carrossel-track">
          <img src="camiseta2/frente.jpg" />
          <img src="camiseta2/costas.jpg" />
          <img src="camiseta2/detalhe.jpg" />
          <img src="camiseta2/tecido.jpg" />
        </div>
        <button class="prev">‹</button>
        <button class="next">›</button>
      </div>

      <h2>camiseta oversized 02</h2>
      <p class="preco">r$ 199,00</p>
      <p class="descricao">algodão 100% • estampa silk • conforto diário</p>
      <a href="produto2.html" class="botao-ver">ver produto</a>
    </article>

    <!-- Repita até camiseta 10 -->

  </section>
</main>

<footer class="rodape-site">
  <p>tee shirt club<br>feito com intenção</p>
  <a href="https://instagram.com/teeshirtclub" target="_blank">@teeshirtclub</a>
</footer>

<script>
  document.querySelectorAll('[data-carrossel]').forEach(carrossel => {
    const track = carrossel.querySelector('.carrossel-track');
    const slides = track.children;
    let index = 0;

    carrossel.querySelector('.next').onclick = () => {
      index = (index + 1) % slides.length;
      track.style.transform = `translateX(-${index * 100}%)`;
    };

    carrossel.querySelector('.prev').onclick = () => {
      index = (index - 1 + slides.length) % slides.length;
      track.style.transform = `translateX(-${index * 100}%)`;
    };
  });
</script>

</body>
</html>
